version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smart_grid_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=smart_grid_theft_fl
    networks:
      - smart_grid_net

  local-chain:
    image: trufflesuite/ganache:latest
    container_name: smart_grid_blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"
    command: >
      --miner.blockGasLimit 12000000
      --wallet.deterministic true
      --wallet.totalAccounts 10
      --wallet.defaultBalance 100
      --chain.networkId 1337
    networks:
      - smart_grid_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smart_grid_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - BLOCKCHAIN_RPC_URL=http://local-chain:8545
      - FL_SERVER_HOST=fl-server
      - FL_SERVER_PORT=8080
    depends_on:
      - mongodb
      - local-chain
    networks:
      - smart_grid_net

  fl-server:
    build:
      context: .
      dockerfile: Dockerfile.fl_server
    container_name: smart_grid_fl_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - BLOCKCHAIN_RPC_URL=http://local-chain:8545
    depends_on:
      - mongodb
      - local-chain
    networks:
      - smart_grid_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_grid_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - smart_grid_net

volumes:
  mongodb_data:

networks:
  smart_grid_net:
    driver: bridge
